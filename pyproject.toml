[project]
name = "canvas-sync"
version = "0.1.0"
description = "Mirror Canvas LMS course files into a local folder, git-pull style."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "keyring>=25",
    "tomlkit>=0.12",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
canvas = "canvas_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_sync"]
