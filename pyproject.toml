[project]
name = "canvas-sync"
version = "0.1.0"
description = "Mirror Canvas LMS course files into a local folder, git-pull style."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "keyring>=25",
    "tomlkit>=0.12",
    "send2trash>=1.8",
    "pypdfium2>=4.30",
    "pillow>=10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rapidfuzz>=3.14",
    "model2vec>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
canvas = "canvas_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_sync"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["links: needs symlinks (the links in other views)"]
